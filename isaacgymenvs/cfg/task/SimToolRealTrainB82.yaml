# Train B82: contact/physics DR curriculum after B81.
# Keeps the B8 cuboid and B81 reset/calibration curriculum, then adds the
# same linear contact/physics randomization stage used by B62Right.
defaults:
  - SimToolRealTrainB81
  - _self_

env:
  # At 12288 envs this is about 5G transitions, or 25.4k training epochs
  # with horizon_length=16.
  contactDrCurriculumSteps: 406901

task:
  randomize: True
  randomization_params:
    frequency: 720

    observations:
      range: [0.0, 0.0]
      range_correlated: [0.0, 0.0]
      operation: additive
      distribution: gaussian
    actions:
      range: [0.0, 0.0]
      range_correlated: [0.0, 0.0]
      operation: additive
      distribution: gaussian

    sim_params:
      gravity:
        range: [0.0, 0.1]
        operation: additive
        distribution: gaussian
        schedule: linear
        schedule_steps: ${task.env.contactDrCurriculumSteps}

    actor_params:
      robot:
        color: null
        dof_properties: null
        rigid_body_properties: null
        rigid_shape_properties: null

      object:
        rigid_body_properties:
          mass:
            range: [0.9, 1.1]
            operation: scaling
            distribution: uniform
            schedule: linear
            schedule_steps: ${task.env.contactDrCurriculumSteps}
            setup_only: False
        rigid_shape_properties:
          friction:
            num_buckets: 100
            range: [0.7, 1.4]
            operation: scaling
            distribution: uniform
            schedule: linear
            schedule_steps: ${task.env.contactDrCurriculumSteps}
          restitution:
            num_buckets: 20
            range: [0.0, 0.03]
            operation: additive
            distribution: uniform
            schedule: linear
            schedule_steps: ${task.env.contactDrCurriculumSteps}

      table_object:
        rigid_shape_properties:
          friction:
            num_buckets: 100
            range: [0.8, 1.3]
            operation: scaling
            distribution: uniform
            schedule: linear
            schedule_steps: ${task.env.contactDrCurriculumSteps}
          restitution:
            num_buckets: 20
            range: [0.0, 0.03]
            operation: additive
            distribution: uniform
            schedule: linear
            schedule_steps: ${task.env.contactDrCurriculumSteps}
