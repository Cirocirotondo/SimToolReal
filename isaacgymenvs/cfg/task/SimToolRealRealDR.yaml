# Train_5-like preset used as a lighter intermediate sim2real baseline.
# Keep the simpler reward / disturbance / DR settings of train_5, while
# preserving the newer low-table scene, 5-7 cm cube family, and updated UR5e
# initial pose used in the later sim2real experiments.
defaults:
  - SimToolReal
  - _self_

env:
  # Updated UR5e start pose kept from the later sim2real setup.
  defaultArmDofPos: [-1.5708, -1.2, 1.8, -0.6, 1.571, -1.571]
  startArmHigher: False

  # Keep the low-table convention introduced for sim2real.
  # table_narrow.urdf is a 0.30 m box centered on tableResetZ, so with
  # center in [-0.15, -0.10] the top surface lies in z=[0.00, 0.05].
  tableResetZ: -0.125
  tableResetZRange: 0.025
  objectFallResetZ: -0.05

  # Preserve the goal volume relative to the lower support surface.
  targetVolumeMins: [-0.35, -0.2, 0.07]
  targetVolumeMaxs: [0.35, 0.2, 0.42]

  # Keep the procedural cube size variation requested for the intermediate
  # experiments, but remove the extra COM offset randomization from train_7.
  handleHeadTypes: ["cube"]
  cubeSizeRange: [0.05, 0.07]
