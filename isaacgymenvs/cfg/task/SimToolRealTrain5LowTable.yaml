# Train-5-like preset on the low-table scene.
# Inherits the reward, disturbances, reset noise, delays, and inactive physics
# DR from the train-5/base task, while using the newer low-table setup.
defaults:
  - SimToolReal
  - _self_

env:
  defaultArmDofPos: [-1.5708, -1.2, 1.8, -0.6, 1.571, -1.571]
  tableResetZ: -0.125
  tableResetZRange: 0.025
  tableObjectZOffset: 0.25
  objectFallResetZ: -0.05
  targetVolumeMins: [-0.35, -0.2, 0.07]
  targetVolumeMaxs: [0.35, 0.2, 0.42]

  fixedSizeKeypointReward: False
  handleHeadTypes: ["cube"]
  cubeSizeRange: [0.05, 0.07]
  useSingleHandleHeadTemplate: True
  numObjectsPerType: 20
