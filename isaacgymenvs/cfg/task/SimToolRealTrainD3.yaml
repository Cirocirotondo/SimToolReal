# Train D3: Reference State Initialization experiment.
# Half of episode resets use the standard D2 start; the other half sample one
# of the curated MuJoCo grasps with the cube already grasped and lifted.
defaults:
  - SimToolRealTrainD2
  - _self_

env:
  # Be less strict than D2 about how much the arm can move
  operationalSpaceArmTranslationSpeedScale: 0.2
  operationalSpaceArmRotationSpeedScale: 0.8
  operationalSpaceMaxJointDelta: 0.04
  armMovingAverage: 0.8
  #kukaActionsPenaltyScale: 0.05

  handSide: right

  useReferenceStateInitialization: True
  referenceStateInitProbability: 0.5
  referenceStatePositionOffset: [0.0, 0.6, 0.0]
  referenceStateObjectSize: [0.05, 0.05, 0.05]
  referenceStateFiles:
    - deployment/mujoco_ur5e_delto/grasp_candidate_5.json
    - deployment/mujoco_ur5e_delto/grasp_candidate_5_1.json
    - deployment/mujoco_ur5e_delto/grasp_candidate_5_2.json
    - deployment/mujoco_ur5e_delto/grasp_candidate_5_3.json
    - deployment/mujoco_ur5e_delto/grasp_candidate_5_4.json
    - deployment/mujoco_ur5e_delto/grasp_candidate_5_5.json
    - deployment/mujoco_ur5e_delto/grasp_candidate_5_6.json
    - deployment/mujoco_ur5e_delto/grasp_candidate_5_7.json

  # Saved physical states may exceed a URDF stop by a tiny amount because
  # MuJoCo constraints are compliant. Clamp only sub-milliradian overshoot.
  referenceStateJointLimitTolerance: 0.002

  # All references were designed for a 5 cm cube.
  cubeSizeRange: [0.05, 0.050001]
