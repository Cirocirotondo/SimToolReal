# B7 uses standard on-policy PPO instead of the SAPG exploration/aggregation scheme.
defaults:
  - SimToolRealLSTMAsymmetricTrainB6PPO
  - _self_

params:
  network:
    space:
      continuous:
        fixed_sigma: fixed

  config:
    name: ${resolve_default:SimToolRealLSTMAsymmetricTrainB7PPO,${....experiment}}
    training_variant: ppo
    ppo: True
    expl_type: none
    use_others_experience: none
    off_policy_ratio: 0.0
    expl_reward_type: none
    expl_reward_coef_scale: 0.0
