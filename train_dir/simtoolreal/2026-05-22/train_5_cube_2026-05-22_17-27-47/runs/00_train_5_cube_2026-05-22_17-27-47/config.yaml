task:
  name: SimToolReal
  physics_engine: ${..physics_engine}
  env:
    numEnvs: 12288
    envSpacing: 1.2
    episodeLength: 600
    enableCameraSensors: true
    enableDebugVis: false
    evalStats: false
    clampAbsObservations: 10.0
    stiffnessScale: 1.0
    forceLimitScale: 1.0
    useRelativeControl: false
    dofSpeedScale: 1.5
    handMovingAverage: 0.1
    armMovingAverage: 0.1
    armDofs: 6
    armEndEffectorLinkName: wrist_3_link
    palmLinkName: wrist_3_link
    palmOffset:
    - 0.0
    - 0.0
    - 0.16
    defaultArmDofPos:
    - -1.5708
    - -1.571
    - 1
    - 0.5
    - 1.571
    - -1.571
    dofSpeedScaleFinal: ${eval:"None"}
    armMovingAverageFinal: ${eval:"None"}
    handMovingAverageFinal: ${eval:"None"}
    controlFrequencyInv: 1
    resetPositionNoiseX: 0.1
    resetPositionNoiseY: 0.1
    resetPositionNoiseZ: 0.02
    randomizeObjectRotation: true
    resetDofPosRandomIntervalFingers: 0.03
    resetDofPosRandomIntervalArm: 0.03
    resetDofVelRandomInterval: 0.15
    robotBaseY: 0.6
    tablePoseDy: -0.6
    tableResetZ: 0.38
    tableResetZRange: 0.01
    tableObjectZOffset: 0.25
    forceScale: 6.0
    forceProbRange:
    - 0.001
    - 0.1
    forceDecay: 0.0
    forceDecayInterval: 0.08
    forceOnlyWhenLifted: true
    torqueScale: 0.5
    torqueProbRange:
    - 0.001
    - 0.1
    torqueDecay: 0.0
    torqueDecayInterval: 0.08
    torqueOnlyWhenLifted: true
    linVelImpulseProbRange:
    - 0.001
    - 0.1
    linVelImpulseScale: 0.0
    linVelImpulseOnlyWhenLifted: true
    angVelImpulseProbRange:
    - 0.001
    - 0.1
    angVelImpulseScale: 0.0
    angVelImpulseOnlyWhenLifted: true
    liftingRewScale: 20.0
    liftingBonus: 300.0
    liftingBonusThreshold: 0.15
    keypointRewScale: 200.0
    distanceDeltaRewScale: 50.0
    reachGoalBonus: 1000.0
    kukaActionsPenaltyScale: 0.03
    handActionsPenaltyScale: 0.003
    fingertipSpreadPenaltyScale: 0.25
    fingertipMultiContactBonusScale: 0.1
    fingertipMultiContactDistThresholdM: 0.06
    fingertipMultiContactMinFingers: 5
    fingertipThumbBonusScale: 0.05
    fingertipThumbIndex: null
    fallDistance: 0.24
    fallPenalty: 0.0
    objectLinVelPenaltyScale: 0.0
    objectAngVelPenaltyScale: 0.0
    privilegedActions: false
    privilegedActionsTorque: 0.02
    keypointScale: 1.5
    objectBaseSize: 0.04
    observationType: full_state
    successTolerance: 0.075
    targetSuccessTolerance: 0.01
    evalSuccessTolerance: null
    toleranceCurriculumIncrement: 0.9
    toleranceCurriculumInterval: 3000
    maxConsecutiveSuccesses: 50
    successSteps: 10
    forceConsecutiveNearGoalSteps: false
    saveStates: false
    saveStatesFile: rootTensorsDofStates.bin
    loadInitialStates: false
    loadStatesFile: rootTensorsDofStates.bin
    goodResetBoundary: 0
    objectName: handle_head_primitives
    useFixedGoalStates: false
    useFixedInitObjectPose: false
    fixedGoalStates: null
    fixedGoalStatesJsonPath: null
    use_hack_object_pos_offset: false
    hack_object_pos_offset: 0.05
    record_data: false
    record_data_num_steps: 1000
    capture_video: true
    capture_video_freq: 6000
    capture_video_len: 600
    turn_off_extra_obs: false
    turn_off_extra_obs_slowly: false
    turn_off_palm_vel_obs: false
    turn_off_palm_vel_obs_slowly: false
    turn_off_object_vel_obs: false
    turn_off_object_vel_obs_slowly: false
    use_obs_dropout: false
    init_tyler_curriculum_scale: 0.0
    VISUALIZE_PD_TARGET_AS_BLUE_ROBOT: false
    withTableForceSensor: false
    curriculumSuccessRatio: 0.6
    resetWhenDropped: false
    timeToUpdateTylerCurriculum: 5
    updateStepSizeTylerCurriculum: 0.01
    stateList:
    - joint_pos
    - joint_vel
    - prev_action_targets
    - palm_pos
    - palm_rot
    - palm_vel
    - object_rot
    - object_vel
    - fingertip_pos_rel_palm
    - keypoints_rel_palm
    - keypoints_rel_goal
    - object_scales
    - closest_keypoint_max_dist
    - closest_fingertip_dist
    - lifted_object
    - progress
    - successes
    - reward
    obsList:
    - joint_pos
    - joint_vel
    - prev_action_targets
    - palm_pos
    - palm_rot
    - object_rot
    - fingertip_pos_rel_palm
    - keypoints_rel_palm
    - keypoints_rel_goal
    - object_scales
    fixedSizeKeypointReward: true
    fixedSize:
    - 0.05
    - 0.05
    - 0.05
    startArmHigher: false
    use_green_robot: true
    sanity_check_controls: false
    add_prev_targets_to_obs: false
    jointVelocityPenaltyScale: 0.0
    jointAccelerationPenaltyScale: 0.0
    goalSamplingType: delta
    targetVolumeRegionScale: 1.0
    deltaGoalDistance: 0.1
    deltaRotationDegrees: 90.0
    targetVolumeMins:
    - -0.35
    - -0.2
    - 0.6
    targetVolumeMaxs:
    - 0.35
    - 0.2
    - 0.95
    useObsDelay: true
    obsDelayMax: 3
    useActionDelay: true
    actionDelayMax: 3
    useObjectStateDelayNoise: true
    objectStateDelayMax: 10
    objectStateXyzNoiseStd: 0.01
    objectStateRotationNoiseDegrees: 5.0
    objectScaleNoiseMultiplierRange:
    - 0.9
    - 1.1
    jointVelocityObsNoiseStd: 0.1
    forceNoReset: false
    objectStartPose: ${eval:"None"}
    goalObjectPose: ${eval:"None"}
    handleHeadTypes:
    - cube
    numObjectsPerType: 1
    useSingleHandleHeadTemplate: true
    modifyAssetFrictions: true
    robotFriction: 0.5
    fingerTipFriction: 1.5
    objectFriction: 0.5
    tableFriction: 0.5
    robotRestitution: 0.0
    fingerTipRestitution: 0.0
    objectRestitution: 0.0
    tableRestitution: 0.0
    asset:
      robot: urdf/ur5e_delto_description/ur5e_left_dg5f.urdf
      flipVisualAttachments: true
      table: urdf/table_narrow.urdf
    useSparseReward: false
  task:
    randomize: false
    randomization_params:
      frequency: 720
      observations:
        range:
        - 0
        - 0.01
        range_correlated:
        - 0
        - 0.01
        operation: additive
        distribution: gaussian
        schedule: constant
        schedule_steps: 5000
      actions:
        range:
        - 0.0
        - 0.01
        range_correlated:
        - 0.0
        - 0.01
        operation: additive
        distribution: gaussian
        schedule: linear
        schedule_steps: 5000
      sim_params:
        gravity:
          range:
          - 0
          - 0.3
          operation: additive
          distribution: gaussian
      actor_params:
        robot:
          color: true
          dof_properties:
            damping:
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: loguniform
            stiffness:
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: loguniform
            effort:
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
            friction:
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
            armature:
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
          rigid_body_properties:
            mass:
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
              setup_only: true
          rigid_shape_properties:
            friction:
              num_buckets: 100
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
            restitution:
              num_buckets: 100
              range:
              - 0.0
              - 0.3
              operation: additive
              distribution: uniform
        object:
          rigid_body_properties:
            mass:
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
              setup_only: true
          rigid_shape_properties:
            friction:
              num_buckets: 100
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
            restitution:
              num_buckets: 100
              range:
              - 0.0
              - 0.3
              operation: additive
              distribution: uniform
  sim:
    substeps: 2
    dt: ${eval:"1/60"}
    up_axis: z
    use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
    num_client_threads: 8
    gravity:
    - 0.0
    - 0.0
    - -9.81
    physx:
      num_threads: 6
      solver_type: 1
      num_position_iterations: 8
      num_velocity_iterations: 0
      max_gpu_contact_pairs: ${eval:"8*1024*1024"}
      num_subscenes: ${....num_subscenes}
      contact_offset: 0.002
      rest_offset: 0.0
      bounce_threshold_velocity: 0.2
      max_depenetration_velocity: 2.0
      default_buffer_size_multiplier: 25.0
      contact_collection: 0
train:
  params:
    seed: ${...seed}
    algo:
      name: a2c_continuous
    model:
      name: continuous_a2c_logstd
    network:
      name: actor_critic
      separate: false
      space:
        continuous:
          mu_activation: None
          sigma_activation: None
          mu_init:
            name: default
          sigma_init:
            name: const_initializer
            val: 0
          fixed_sigma: coef_cond
      mlp:
        units:
        - 1024
        - 1024
        - 512
        - 512
        activation: elu
        d2rl: false
        initializer:
          name: default
        regularizer:
          name: None
      rnn:
        name: lstm
        units: 1024
        layers: 1
        before_mlp: true
        layer_norm: true
    load_checkpoint: ${if:${...checkpoint},True,False}
    load_path: ${...checkpoint}
    config:
      name: ${resolve_default:SimToolRealLSTMAsymmetricPPO,${....experiment}}
      device_name: ${resolve_default:cuda:0,${....rl_device}}
      env_name: rlgpu
      multi_gpu: ${....multi_gpu}
      ppo: true
      mixed_precision: true
      normalize_input: true
      normalize_value: true
      normalize_advantage: true
      reward_shaper:
        scale_value: 0.01
      num_actors: ${....task.env.numEnvs}
      gamma: 0.99
      tau: 0.95
      learning_rate: 0.0001
      lr_schedule: adaptive
      schedule_type: standard
      kl_threshold: 0.016
      score_to_win: 1000000
      max_epochs: 1000000
      max_frames: 100000000000000
      save_best_after: 100
      save_frequency: 3000
      print_stats: true
      grad_norm: 1.0
      entropy_coef: 0.0
      truncate_grads: true
      e_clip: 0.1
      minibatch_size: 98304
      mini_epochs: 2
      critic_coef: 4.0
      clip_value: true
      horizon_length: 16
      seq_length: 16
      bounds_loss_coef: 0.0001
      defer_summaries_sec: ${if:${....pbt},240,5}
      summaries_interval_sec_min: ${if:${....pbt},60,5}
      summaries_interval_sec_max: 300
      good_reset_boundary: 0
      use_others_experience: lf
      off_policy_ratio: 1.0
      expl_type: mixed_expl_learn_param
      expl_reward_coef_embd_size: 32
      expl_reward_coef_scale: 0.005
      expl_reward_type: entropy
      expl_coef_block_size: 2048
      player:
        deterministic: false
        games_num: 100000
        print_stats: false
      central_value_config:
        minibatch_size: 98304
        mini_epochs: 2
        learning_rate: 0.0001
        kl_threshold: 0.016
        clip_value: true
        normalize_input: true
        truncate_grads: true
        network:
          name: actor_critic
          central_value: true
          mlp:
            units:
            - 1024
            - 1024
            - 512
            - 512
            activation: elu
            d2rl: false
            initializer:
              name: default
            regularizer:
              name: None
      expl_reward_coef: 0.0
pbt:
  enabled: false
task_name: ${task.name}
experiment: 00_train_5_cube_2026-05-22_17-27-47
num_envs: ''
seed: 0
torch_deterministic: false
max_iterations: ''
physics_engine: physx
pipeline: gpu
sim_device: cuda:0
rl_device: cuda:0
graphics_device_id: 0
num_threads: 4
solver_type: 1
num_subscenes: 4
test: false
checkpoint: ''
checkpoint_yaml: ''
sigma: ''
multi_gpu: false
wandb_activate: true
wandb_group: '2026-05-22'
wandb_name: ${train.params.config.name}
wandb_entity: simonecirelli-eth
wandb_project: simtoolreal
wandb_tags: []
wandb_logcode_dir: ''
capture_video: false
capture_video_freq: 1464
capture_video_len: 100
force_render: true
headless: true
wandb_notes: ''
